name: Publish the on-device app to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the sample notebook for the demo button
        env:
          LIVING_DRAFT_DATA_DIR: ${{ runner.temp }}/demo-data
        run: |
          npm run seed -- --no-art
          npm run demo:export -- "$GITHUB_WORKSPACE/apps/web/public/demo/kinjal.zip"
      - name: Build the app
        env:
          LIVING_DRAFT_BASE: /${{ github.event.repository.name }}/
        run: |
          npm run build:app
          cp apps/web/dist-app/index.html apps/web/dist-app/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist-app

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
